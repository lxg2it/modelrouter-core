services:
  modelrouter:
    build: .
    container_name: modelrouter
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - LOG_LEVEL=info
      - DEFAULT_TIER=standard
      - DEFAULT_OUTPUT_RATIO=0.33
      # Provider API keys — set in .env or environment
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # Stripe billing (optional — card payments)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      # Email (Resend)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-auth@api.lxg2it.com}
      # Satbill billing (optional — Bitcoin payments)
      - SATBILL_BASE_URL=${SATBILL_BASE_URL:-}
      - SATBILL_API_SECRET=${SATBILL_API_SECRET:-}
      # xAI / Grok
      - GROK_API_KEY=${GROK_API_KEY:-}
      # Admin access
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    volumes:
      - modelrouter-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  modelrouter-data:
