services:
  modelrouter:
    build: .
    container_name: modelrouter
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3003
      - LOG_LEVEL=info
      - DEFAULT_TIER=standard
      - DEFAULT_OUTPUT_RATIO=0.33
    volumes:
      - modelrouter-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  modelrouter-data:
