services:
  modelrouter:
    image: ghcr.io/lxg2it/modelrouter:latest
    container_name: modelrouter
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3003
      - LOG_LEVEL=info
      - DEFAULT_TIER=standard
      - DEFAULT_OUTPUT_RATIO=0.33
      - DB_PATH=/data/modelrouter.db
    volumes:
      - modelrouter-data:/data
      - modelrouter-logs:/var/log/modelrouter
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  modelrouter-data:
    external: true
    name: modelrouter-data
  modelrouter-logs:
    name: modelrouter-logs
